# ZiraHive: self-hosted backup + media server
#
#   docker compose up -d --build                   core stack (home network)
#   docker compose --profile remote up -d --build  + secure access from anywhere (Tailscale)
#   docker compose --profile ai up -d              + local AI (Ollama)
#
# Settings live in .env (copy .env.example to .env first).

name: zirahive

x-server-env: &server-env
  ZIRAHIVE_DATA_DIR: /data
  ZIRAHIVE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zirahive}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zirahive}
  ZIRAHIVE_REDIS_URL: redis://redis:6379
  ZIRAHIVE_SECRET_KEY: ${ZIRAHIVE_SECRET_KEY:-}
  # Every folder inside MEDIA_PATH (English Movies, Web Series, ...) becomes a Watch category.
  ZIRAHIVE_MEDIA_ROOT: /media
  ZIRAHIVE_MEDIA_HOST_PATH: ${MEDIA_PATH:-}
  ZIRAHIVE_MEDIA_LIBRARIES: ${ZIRAHIVE_MEDIA_LIBRARIES:-}
  ZIRAHIVE_TMDB_API_KEY: ${ZIRAHIVE_TMDB_API_KEY:-}
  ZIRAHIVE_PUBLIC_URL: ${ZIRAHIVE_PUBLIC_URL:-}
  ZIRAHIVE_LAN_URL: ${ZIRAHIVE_LAN_URL:-}
  ZIRAHIVE_SERVER_NAME: ${ZIRAHIVE_SERVER_NAME:-}
  ZIRAHIVE_ICE_SERVERS: ${ZIRAHIVE_ICE_SERVERS:-}
  ZIRAHIVE_OCR: ${ZIRAHIVE_OCR:-documents}
  ZIRAHIVE_API_DOCS: "false"
  ZIRAHIVE_HW_ACCEL: ${ZIRAHIVE_HW_ACCEL:-auto}
  ZIRAHIVE_MAX_TRANSCODES: ${ZIRAHIVE_MAX_TRANSCODES:-3}
  NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
  ZIRAHIVE_CORS_ORIGINS: ""

x-server-volumes: &server-volumes
  - ${ZIRAHIVE_DATA_PATH:-./zirahive-data}:/data
  # Your media folder (optional), read-only so ZiraHive can never modify or delete it.
  - ${MEDIA_PATH:-./media}:/media:ro
  # Optional: whole drives, read-only, to pick more folders in Settings > Server > Categories >
  # Choose folder. Only drives you list in .env (DRIVE_E=E:/) are shared; the rest show nothing.
  - ${DRIVE_C:-./no-drive}:/drives/c:ro
  - ${DRIVE_D:-./no-drive}:/drives/d:ro
  - ${DRIVE_E:-./no-drive}:/drives/e:ro
  - ${DRIVE_F:-./no-drive}:/drives/f:ro
  - ${DRIVE_G:-./no-drive}:/drives/g:ro
  - ${DRIVE_H:-./no-drive}:/drives/h:ro
  - ${DRIVE_I:-./no-drive}:/drives/i:ro
  - ${DRIVE_J:-./no-drive}:/drives/j:ro
  # Offsite backup to a USB or second disk: mount a folder on it here, then choose
  # /backup-disk/zirahive in Settings > Server > Offsite backup. See docs/BACKUP.md.
  # - F:/ZiraHive Backup:/backup-disk

services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      # Home network access. Set ZIRAHIVE_BIND=127.0.0.1 to allow only this PC
      # (then use Tailscale from every other device).
      - "${ZIRAHIVE_BIND:-0.0.0.0}:${ZIRAHIVE_HTTP_PORT:-8080}:80"
      # The share-links-only site (8081) is NOT published here on purpose:
      # only the tailscale container reaches it, through the Docker network.
    environment:
      ZIRAHIVE_SITE_ADDRESS: ${ZIRAHIVE_SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    environment: *server-env
    volumes: *server-volumes
    # NVIDIA GPU for converting video while you watch (much faster than the CPU).
    # Needs an NVIDIA card, a current Windows driver and Docker Desktop with WSL 2.
    # Uncomment these lines, then `docker compose up -d`. Settings > Server shows "NVIDIA GPU"
    # next to anything being converted when it works.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu, video, compute, utility] }]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./server
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      disable: true
    environment: *server-env
    volumes: *server-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # NVIDIA GPU for offline copies: same as for `api` above.
    # environment: same as api, plus the line below
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu, video, compute, utility] }]

  postgres:
    # pgvector is included now so AI search can be added later without a migration of images.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zirahive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zirahive}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # ---- optional: access from anywhere (docker compose --profile remote up -d) ----
  # Private: https://zirahive.<your-tailnet>.ts.net  -> whole app, your devices only
  # Public:  https://zirahive.<your-tailnet>.ts.net:8443 -> share links only (Tailscale Funnel)
  # Setup steps: docs/REMOTE_ACCESS.md
  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["remote"]
    hostname: ${TS_HOSTNAME:-zirahive}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-zirahive}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/${TS_SERVE_FILE:-serve.json}
      TS_USERSPACE: "true"  # no special network driver needed; works with Docker Desktop
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - web

  # ---- optional: local AI (docker compose --profile ai up -d) -------------
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

# Installs from before the rename (GharBox) keep their database and Tailscale identity:
# setup.ps1 points these at the old volumes when it finds them.
volumes:
  tailscale-state:
    name: ${TAILSCALE_VOLUME:-zirahive_tailscale-state}
  postgres-data:
    name: ${DATABASE_VOLUME:-zirahive_postgres-data}
  redis-data:
  caddy-data:
    name: ${CADDY_VOLUME:-zirahive_caddy-data}
  ollama-models:
    name: ${OLLAMA_VOLUME:-zirahive_ollama-models}
