# GharBox: self-hosted backup + media server
#
#   docker compose up -d --build                   core stack (home network)
#   docker compose --profile remote up -d --build  + secure access from anywhere (Tailscale)
#   docker compose --profile ai up -d              + local AI (Ollama)
#
# Settings live in .env (copy .env.example to .env first).

name: gharbox

x-server-env: &server-env
  GHARBOX_DATA_DIR: /data
  GHARBOX_DATABASE_URL: postgresql+asyncpg://gharbox:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gharbox
  GHARBOX_REDIS_URL: redis://redis:6379
  GHARBOX_SECRET_KEY: ${GHARBOX_SECRET_KEY:-}
  # Every folder inside MEDIA_PATH (English Movies, Web Series, ...) becomes a Watch category.
  GHARBOX_MEDIA_ROOT: /media
  GHARBOX_MEDIA_LIBRARIES: ${GHARBOX_MEDIA_LIBRARIES:-}
  GHARBOX_TMDB_API_KEY: ${GHARBOX_TMDB_API_KEY:-}
  GHARBOX_PUBLIC_URL: ${GHARBOX_PUBLIC_URL:-}
  GHARBOX_API_DOCS: "false"
  GHARBOX_HW_ACCEL: ${GHARBOX_HW_ACCEL:-auto}
  GHARBOX_MAX_TRANSCODES: ${GHARBOX_MAX_TRANSCODES:-3}
  NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
  GHARBOX_CORS_ORIGINS: ""

x-server-volumes: &server-volumes
  - ${GHARBOX_DATA_PATH:-./gharbox-data}:/data
  # Your media folder, read-only so GharBox can never modify or delete it.
  - ${MEDIA_PATH:-./media}:/media:ro
  # A category on another drive: mount it outside /media, then add it in
  # Settings > Watch categories > Add a folder from another drive.
  # - E:/Korean Dramas:/media-e/korean-dramas:ro

services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      # Home network access. Set GHARBOX_BIND=127.0.0.1 to allow only this PC
      # (then use Tailscale from every other device).
      - "${GHARBOX_BIND:-0.0.0.0}:${GHARBOX_HTTP_PORT:-8080}:80"
      # The share-links-only site (8081) is NOT published here on purpose:
      # only the tailscale container reaches it, through the Docker network.
    environment:
      GHARBOX_SITE_ADDRESS: ${GHARBOX_SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    environment: *server-env
    volumes: *server-volumes
    # NVIDIA GPU for converting video while you watch (much faster than the CPU).
    # Needs an NVIDIA card, a current Windows driver and Docker Desktop with WSL 2.
    # Uncomment these lines, then `docker compose up -d`. Settings > Server shows "NVIDIA GPU"
    # next to anything being converted when it works.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu, video, compute, utility] }]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./server
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      disable: true
    environment: *server-env
    volumes: *server-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # NVIDIA GPU for offline copies: same as for `api` above.
    # environment: same as api, plus the line below
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu, video, compute, utility] }]

  postgres:
    # pgvector is included now so AI search can be added later without a migration of images.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gharbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gharbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gharbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  # ---- optional: access from anywhere (docker compose --profile remote up -d) ----
  # Private: https://gharbox.<your-tailnet>.ts.net  -> whole app, your devices only
  # Public:  https://gharbox.<your-tailnet>.ts.net:8443 -> share links only (Tailscale Funnel)
  # Setup steps: docs/REMOTE_ACCESS.md
  tailscale:
    image: tailscale/tailscale:stable
    profiles: ["remote"]
    hostname: ${TS_HOSTNAME:-gharbox}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-gharbox}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/${TS_SERVE_FILE:-serve.json}
      TS_USERSPACE: "true"  # no special network driver needed; works with Docker Desktop
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - web

  # ---- optional: local AI (docker compose --profile ai up -d) -------------
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  tailscale-state:
  postgres-data:
  redis-data:
  caddy-data:
  ollama-models:
