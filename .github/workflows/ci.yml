name: CI

on:
  push:
  pull_request:

permissions:
  contents: write   # failing jobs push their log to a ci-log-<job> branch, readable without GitHub's log viewer

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:   # the migrations are also checked against the database Docker installs use
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: zirahive, POSTGRES_PASSWORD: zirahive, POSTGRES_DB: zirahive }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U zirahive" --health-interval 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://zirahive:zirahive@localhost:5432/zirahive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libarchive-tools poppler-utils tesseract-ocr tesseract-ocr-ben
      - run: pip install -r server/requirements-dev.txt
      - run: set -o pipefail; pytest -q 2>&1 | tee ${{ github.workspace }}/ci-server.log
        shell: bash
        working-directory: server
      - name: Share the log
        if: failure()
        run: |
          mkdir -p /tmp/cilog && cp ${{ github.workspace }}/ci-server.log /tmp/cilog/ 2>/dev/null || echo "no log" > /tmp/cilog/ci-server.log
          cd /tmp/cilog && git init -q -b ci-log-server && git config user.name "ZiraHive CI" && git config user.email "ci@zirahive.invalid"
          git add . && git commit -q -m "log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-server

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run check:i18n
        working-directory: web
      - run: npm run build
        working-directory: web

  ai-helper:
    runs-on: ubuntu-latest
    env:
      ZIRAHIVE_AI_MODELS: /tmp/ai-models   # the face models download here (CLIP and Whisper aren't needed)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ai/requirements.txt }
      - run: pip install -r ai/requirements.txt pytest httpx
      - run: set -o pipefail; pytest -q ai/tests 2>&1 | tee ${{ github.workspace }}/ci-ai.log
        shell: bash
      - name: Share the log
        if: failure()
        run: |
          mkdir -p /tmp/cilog && cp ${{ github.workspace }}/ci-ai.log /tmp/cilog/ 2>/dev/null || echo "no log" > /tmp/cilog/ci-ai.log
          cd /tmp/cilog && git init -q -b ci-log-ai && git config user.name "ZiraHive CI" && git config user.email "ci@zirahive.invalid"
          git add . && git commit -q -m "log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-ai

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci12345/' .env
      - run: |
          set -o pipefail
          { docker compose build --progress plain && docker compose config --quiet \
            && docker compose --profile ai --profile remote config --quiet \
            && docker compose --profile ai build --progress plain ai; } 2>&1 | tee ${{ github.workspace }}/ci-docker.log
        shell: bash
      - name: Share the log
        if: failure()
        run: |
          mkdir -p /tmp/cilog && cp ${{ github.workspace }}/ci-docker.log /tmp/cilog/ 2>/dev/null || echo "no log" > /tmp/cilog/ci-docker.log
          cd /tmp/cilog && git init -q -b ci-log-docker && git config user.name "ZiraHive CI" && git config user.email "ci@zirahive.invalid"
          git add . && git commit -q -m "log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log-docker

  e2e:
    runs-on: ubuntu-latest
    needs: [server-tests, web-build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: zirahive, POSTGRES_PASSWORD: zirahive, POSTGRES_DB: zirahive }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U zirahive" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ZIRAHIVE_DATA_DIR: ${{ github.workspace }}/ci-data
      ZIRAHIVE_DATABASE_URL: postgresql+asyncpg://zirahive:zirahive@localhost:5432/zirahive
      ZIRAHIVE_REDIS_URL: redis://localhost:6379
      ZIRAHIVE_MEDIA_ROOT: ${{ github.workspace }}/ci-media
      ZIRAHIVE_LAN_URL: http://192.168.1.50:4173
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: sudo apt-get install -y libarchive-tools poppler-utils tesseract-ocr tesseract-ocr-ben
      - run: pip install -r server/requirements.txt
      - run: scripts/make-sample-media.sh "$ZIRAHIVE_MEDIA_ROOT"
      - name: Start API and worker
        working-directory: server
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup arq app.worker.WorkerSettings > ../worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Build and serve web app
        working-directory: web
        run: |
          npm ci && npm run build
          ZIRAHIVE_API=http://localhost:8000 nohup npx vite preview --port 4173 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173 > /dev/null && break; sleep 1; done
      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium chrome
          sleep 10   # let the worker finish scanning the sample media
          npx playwright test
      - if: failure()
        run: tail -n 100 api.log worker.log web.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  sync-client-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sync-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install . pyinstaller
      - run: python make_icon.py
      - run: python -m PyInstaller --onefile --windowed --name ZiraHiveSync --icon zirahive-sync.ico zirahive_sync\__main__.py
      - run: .\dist\ZiraHiveSync.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: ZiraHiveSync-windows
          path: sync-client/dist/ZiraHiveSync.exe
          retention-days: 30
