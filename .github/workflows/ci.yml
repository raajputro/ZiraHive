name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r server/requirements-dev.txt
      - run: pytest -q
        working-directory: server

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci12345/' .env
      - run: docker compose build
      - run: docker compose config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: [server-tests, web-build]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: gharbox, POSTGRES_PASSWORD: gharbox, POSTGRES_DB: gharbox }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gharbox" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      GHARBOX_DATA_DIR: ${{ github.workspace }}/ci-data
      GHARBOX_DATABASE_URL: postgresql+asyncpg://gharbox:gharbox@localhost:5432/gharbox
      GHARBOX_REDIS_URL: redis://localhost:6379
      GHARBOX_MEDIA_ROOT: ${{ github.workspace }}/ci-media
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: scripts/make-sample-media.sh "$GHARBOX_MEDIA_ROOT"
      - run: pip install -r server/requirements.txt
      - name: Start API and worker
        working-directory: server
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup arq app.worker.WorkerSettings > ../worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Build and serve web app
        working-directory: web
        run: |
          npm ci && npm run build
          GHARBOX_API=http://localhost:8000 nohup npx vite preview --port 4173 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173 > /dev/null && break; sleep 1; done
      - name: Run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sleep 10   # let the worker finish scanning the sample media
          npx playwright test
      - if: failure()
        run: tail -n 100 api.log worker.log web.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
