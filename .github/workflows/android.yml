name: android

# Builds the signed ZiraHive Android app. The APK lands on the `apk` branch (latest build only)
# and as a GitHub release, ready to add in ZiraHive → Settings → Android app.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Version
        id: v
        run: |
          code=$((100 + ${{ github.run_number }}))
          name="1.0.${{ github.run_number }}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          printf '{"version_code":%s,"version_name":"%s"}\n' "$code" "$name" > android/app/src/main/assets/zirahive-version.json

      - name: Build
        env:
          ZH_VERSION_CODE: ${{ steps.v.outputs.code }}
          ZH_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: |
          set -o pipefail
          gradle -p android --no-daemon --console=plain assembleRelease 2>&1 | tee build.log

      - name: Share the build log
        if: failure()
        run: |
          mkdir logs && cp build.log logs/ 2>/dev/null || echo "no log" > logs/build.log
          cd logs
          git init -q -b apk-log
          git config user.name "ZiraHive build"
          git config user.email "build@zirahive.invalid"
          git add build.log && git commit -q -m "build log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-log

      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/ZiraHive-${{ steps.v.outputs.name }}.apk"
          ls -l out

      - name: Publish to the apk branch
        run: |
          cd out
          git init -q -b apk
          git config user.name "ZiraHive build"
          git config user.email "build@zirahive.invalid"
          cp ZiraHive-*.apk ZiraHive.apk
          printf 'version_code=%s\nversion_name=%s\ncommit=%s\n' "${{ steps.v.outputs.code }}" "${{ steps.v.outputs.name }}" "${{ github.sha }}" > VERSION
          git add ZiraHive.apk VERSION
          git commit -q -m "ZiraHive ${{ steps.v.outputs.name }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ steps.v.outputs.name }}" out/ZiraHive-${{ steps.v.outputs.name }}.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "ZiraHive for Android ${{ steps.v.outputs.name }}" \
            --notes "Install on the phone, or add it in ZiraHive → Settings → Android app so phones update themselves."
